<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Golf en Ritmo — Canal de Operaciones</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green-dark:#173524;--green:#28543a;--gold:#d2b25f;
  --cream:#f4efe6;--white:#fff;--text:#1d2a22;--muted:#718277;
  --danger:#c53b2d;--success:#207548;--info:#1565c0;
  --shadow:0 4px 16px rgba(0,0,0,.08);--radius:18px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#eee8dc;color:var(--text)}

/* AUTH */
#authLoading{position:fixed;inset:0;background:var(--green-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999}
#authLoading .spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
#authLoading p{color:rgba(255,255,255,.7);font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}
#appWrapper{display:none;height:100%;flex-direction:column}
#appWrapper.visible{display:flex}

/* HEADER */
.header{background:linear-gradient(135deg,var(--green-dark),var(--green));padding:14px 16px;box-shadow:var(--shadow);flex-shrink:0}
.header-top{display:flex;align-items:center;gap:12px}
.back-btn{background:rgba(255,255,255,.15);border:none;color:white;width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-info{flex:1}
.header h1{color:white;font-size:17px;font-weight:700}
.header p{color:#d8c48f;font-size:11px;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
.online-count{background:rgba(255,255,255,.15);color:white;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px}

/* MESSAGES AREA */
.messages{flex:1;overflow-y:auto;padding:12px 12px 0;display:flex;flex-direction:column;gap:10px}
.messages::-webkit-scrollbar{width:4px}
.messages::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}

/* MESSAGE BUBBLE */
.msg{max-width:88%;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.mine{align-self:flex-end}
.msg.other{align-self:flex-start}
.msg-bubble{padding:12px 14px;border-radius:16px;box-shadow:var(--shadow)}
.msg.mine .msg-bubble{background:var(--green-dark);color:white;border-bottom-right-radius:4px}
.msg.other .msg-bubble{background:white;border-bottom-left-radius:4px}
.msg-sender{font-size:11px;font-weight:700;margin-bottom:5px;opacity:.75}
.msg.mine .msg-sender{color:#d8c48f}
.msg.other .msg-sender{color:var(--green)}
.msg-text{font-size:15px;line-height:1.45;word-break:break-word}
.msg.mine .msg-text{color:white}
.msg-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.msg-time{font-size:11px;opacity:.6}
.msg.mine .msg-time{color:rgba(255,255,255,.7)}

/* TAGS */
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;cursor:default}
.tag-resuelto{background:#dcf5e7;color:var(--success)}
.tag-admin{background:#fdf3e0;color:#9a6b00}
.tag-marshall{background:#e8f0fe;color:var(--info)}

/* ACTION BUTTONS */
.msg-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.btn-voy{background:#dcf5e7;color:var(--success);border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-resolver{background:#fdf3e0;color:#9a6b00;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-voy:active,.btn-resolver:active{transform:scale(.96)}

/* RESPUESTAS */
.responses{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.response-item{font-size:12px;background:rgba(255,255,255,.15);border-radius:8px;padding:5px 10px;color:rgba(255,255,255,.9)}
.msg.other .response-item{background:#f0f7f3;color:var(--success)}

/* DATE DIVIDER */
.date-divider{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0;position:relative}
.date-divider::before,.date-divider::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:#ddd}
.date-divider::before{left:0}.date-divider::after{right:0}

/* NOTIFICATION BANNER */
.notif-banner{position:fixed;top:0;left:0;right:0;background:var(--green-dark);color:white;padding:14px 16px;z-index:500;transform:translateY(-100%);transition:transform .3s;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.notif-banner.show{transform:translateY(0)}
.notif-sender{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:3px}
.notif-text{font-size:14px;font-weight:600}

/* INPUT AREA */
.input-area{background:white;padding:10px 12px;border-top:1px solid #ddd;flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.msg-input{flex:1;border:1.5px solid #ddd;border-radius:14px;padding:10px 14px;font-size:15px;font-family:'DM Sans',sans-serif;resize:none;max-height:100px;line-height:1.4;outline:none;transition:border-color .15s}
.msg-input:focus{border-color:var(--green)}
.send-btn{width:44px;height:44px;background:var(--green-dark);border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.send-btn:hover{opacity:.88}
.send-btn:active{transform:scale(.94)}
.send-btn svg{width:20px;height:20px;fill:white}
.input-hint{font-size:11px;color:var(--muted);margin-bottom:6px;padding-left:2px}

.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);padding:40px}
.empty-chat .icon{font-size:48px;opacity:.4}
.empty-chat p{font-size:14px;text-align:center;line-height:1.5}
</style>
</head>
<body>

<div id="authLoading">
  <div class="spinner"></div>
  <p>Cargando canal...</p>
</div>

<div id="notifBanner" class="notif-banner">
  <div class="notif-sender" id="notifSender"></div>
  <div class="notif-text" id="notifText"></div>
</div>

<div id="appWrapper">
  <div class="header">
    <div class="header-top">
      <button class="back-btn" id="backBtn" onclick="volver()">←</button>
      <div class="header-info">
        <h1>Canal de Operaciones</h1>
        <p>Golf en Ritmo · Tiempo real</p>
      </div>
      <div class="online-count" id="onlineCount">...</div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-chat">
      <div class="icon">📡</div>
      <p>Canal activo.<br>Los mensajes aparecen aquí en tiempo real.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-hint" id="inputHint">Escribí un mensaje para todos</div>
    <div class="input-row">
      <textarea class="msg-input" id="msgInput" placeholder="Ej: Falta agua en bebedero H9..." rows="1"
        oninput="autoResize(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMensaje()}"
      ></textarea>
      <button class="send-btn" onclick="enviarMensaje()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot,
         addDoc, updateDoc, doc, serverTimestamp, limit }
                            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJRFwNTC1DJOnTGaDV_FYDyKHif5LKrIE",
  authDomain: "golf-en-ritmo.firebaseapp.com",
  projectId: "golf-en-ritmo",
  storageBucket: "golf-en-ritmo.firebasestorage.app",
  messagingSenderId: "448451530287",
  appId: "1:448451530287:web:5b851afb50480d027940da"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
let currentName = '';
let isAdmin     = false;
let primeraCarga = true;
let ultimoMsgId  = null;

const NOMBRES = {
  'admin@golfenritmo.com':        'Administrador',
  'diegoperez@golfenritmo.com':   'Diego Pérez',
  'diegopereira@golfenritmo.com': 'Diego Pereira',
  'otro@golfenritmo.com':         'Otro Marshall',
};

// ── Auth ────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if(!user){ window.location.href = 'login.html'; return; }
  currentUser = user;
  isAdmin     = user.email === 'admin@golfenritmo.com';
  currentName = NOMBRES[user.email] || user.email.split('@')[0];
  document.getElementById('inputHint').textContent =
    `Escribí un mensaje — lo verán todos los marshalls${isAdmin ? '' : ' y el administrador'}`;
  document.getElementById('authLoading').style.display = 'none';
  document.getElementById('appWrapper').classList.add('visible');
  initChat();
});

window.volver = () => {
  window.location.href = isAdmin ? 'admin.html' : 'index.html';
};

// ── Chat en tiempo real ─────────────────────────────────────
function initChat(){
  const q = query(collection(db,'mensajes'), orderBy('createdAt','asc'), limit(100));
  onSnapshot(q, snap => {
    const msgs = [];
    snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
    renderMensajes(msgs);

    // Notificación para mensajes nuevos (no en primera carga)
    if(!primeraCarga && msgs.length > 0){
      const ultimo = msgs[msgs.length - 1];
      if(ultimo.id !== ultimoMsgId && ultimo.autorEmail !== currentUser.email){
        notificar(ultimo.autor, ultimo.texto);
        vibrar();
      }
    }
    if(msgs.length > 0) ultimoMsgId = msgs[msgs.length-1].id;
    primeraCarga = false;

    // Online count simulado
    const activos = new Set(msgs.filter(m => {
      if(!m.createdAt) return false;
      const ts = m.createdAt.toDate ? m.createdAt.toDate() : new Date(m.createdAt);
      return (Date.now() - ts.getTime()) < 30*60*1000;
    }).map(m => m.autorEmail));
    activos.add(currentUser.email);
    document.getElementById('onlineCount').textContent = `${activos.size} activo${activos.size!==1?'s':''}`;
  });
}

function renderMensajes(msgs){
  const container = document.getElementById('messages');
  if(!msgs.length){
    container.innerHTML = `<div class="empty-chat"><div class="icon">📡</div><p>Canal activo.<br>Los mensajes aparecen aquí en tiempo real.</p></div>`;
    return;
  }

  let html = '';
  let lastDate = '';

  msgs.forEach(m => {
    const esMio = m.autorEmail === currentUser.email;
    const ts    = m.createdAt?.toDate ? m.createdAt.toDate() : new Date();
    const hora  = `${String(ts.getHours()).padStart(2,'0')}:${String(ts.getMinutes()).padStart(2,'0')}`;
    const fecha = ts.toLocaleDateString('es-UY');

    if(fecha !== lastDate){
      const esHoy = fecha === new Date().toLocaleDateString('es-UY');
      html += `<div class="date-divider">${esHoy ? 'Hoy' : fecha}</div>`;
      lastDate = fecha;
    }

    const rolTag = m.autorEmail === 'admin@golfenritmo.com'
      ? `<span class="tag tag-admin">Admin</span>`
      : `<span class="tag tag-marshall">Marshall</span>`;

    const resueltoTag = m.resuelto
      ? `<span class="tag tag-resuelto">✓ Resuelto</span>` : '';

    // Respuestas "Voy"
    let respuestasHTML = '';
    if(m.respuestas && m.respuestas.length){
      respuestasHTML = `<div class="responses">
        ${m.respuestas.map(r => `<div class="response-item">✓ ${r}</div>`).join('')}
      </div>`;
    }

    // Botones de acción
    let botonesHTML = '';
    const yaRespondio = m.respuestas && m.respuestas.includes(currentName);
    if(!esMio && !m.resuelto){
      botonesHTML = `<div class="msg-actions">
        ${!yaRespondio ? `<button class="btn-voy" onclick="responderVoy('${m.id}')">✓ Voy</button>` : ''}
        ${isAdmin ? `<button class="btn-resolver" onclick="marcarResuelto('${m.id}')">✓ Marcar resuelto</button>` : ''}
      </div>`;
    }
    if(esMio && isAdmin && !m.resuelto){
      botonesHTML = `<div class="msg-actions">
        <button class="btn-resolver" onclick="marcarResuelto('${m.id}')">✓ Marcar resuelto</button>
      </div>`;
    }

    html += `
      <div class="msg ${esMio ? 'mine' : 'other'}">
        <div class="msg-bubble">
          <div class="msg-sender">${m.autor} ${rolTag}</div>
          <div class="msg-text">${escHtml(m.texto)}</div>
          ${respuestasHTML}
          <div class="msg-meta">
            <span class="msg-time">${hora}</span>
            ${resueltoTag}
          </div>
          ${botonesHTML}
        </div>
      </div>`;
  });

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// ── Enviar mensaje ──────────────────────────────────────────
window.enviarMensaje = async function(){
  const input = document.getElementById('msgInput');
  const texto = input.value.trim();
  if(!texto) return;
  input.value = '';
  input.style.height = 'auto';

  try{
    await addDoc(collection(db,'mensajes'),{
      autor:       currentName,
      autorEmail:  currentUser.email,
      texto,
      resuelto:    false,
      respuestas:  [],
      createdAt:   serverTimestamp(),
    });
  }catch(e){
    console.error(e);
  }
};

// ── Responder Voy ───────────────────────────────────────────
window.responderVoy = async function(id){
  try{
    const ref  = doc(db,'mensajes',id);
    // Leer respuestas actuales y agregar
    const snap = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      .then(m => m.getDoc(ref));
    const data = snap.data();
    const resp = data.respuestas || [];
    if(resp.includes(currentName)) return;
    resp.push(currentName);
    await updateDoc(ref,{ respuestas: resp });
  }catch(e){ console.error(e); }
};

// ── Marcar resuelto ─────────────────────────────────────────
window.marcarResuelto = async function(id){
  try{
    await updateDoc(doc(db,'mensajes',id),{ resuelto: true });
  }catch(e){ console.error(e); }
};

// ── Notificación visual ─────────────────────────────────────
function notificar(sender, texto){
  const banner = document.getElementById('notifBanner');
  document.getElementById('notifSender').textContent = sender;
  document.getElementById('notifText').textContent   = texto.length > 60 ? texto.slice(0,60)+'…' : texto;
  banner.classList.add('show');
  setTimeout(()=> banner.classList.remove('show'), 4000);
}

function vibrar(){
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

// ── Helpers ─────────────────────────────────────────────────
function escHtml(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

window.autoResize = function(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
};
</script>
</body>
</html>
